<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex 用量统计</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<main>
  <header>
    <div class="brand"><img src="icons/icon.svg" width="32" height="32" alt=""><div><h1>Codex <span>Usage</span></h1><p>你的每日模型用量</p></div></div>
    <div class="actions">
      <button id="update" class="icon-button" title="检查 ccusage 更新" aria-label="检查 ccusage 更新"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M5 15v5h14v-5"/></svg></button>
      <button id="refresh" class="refresh-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.5-1L20 9M4 15l2.4 3A7 7 0 0 0 18 17"/></svg>刷新</button>
    </div>
  </header>
  <section class="filters" aria-label="筛选条件">
    <label class="field"><span>时间范围</span><select id="range"><option value="1" selected>今天</option><option value="7">最近 7 天</option><option value="30">最近 30 天</option><option value="custom">自定义</option></select></label>
    <label class="field model-field"><span>模型</span><select id="model"><option value="all">全部模型</option></select></label>
  </section>
  <div id="custom-dates" class="custom-dates" hidden><label class="field"><span>开始日期</span><input type="date" id="from"></label><label class="field"><span>结束日期</span><input type="date" id="to"></label></div>
  <section class="cards" aria-label="所选范围汇总">
    <article><span>Token 用量 <small>亿</small></span><strong id="tokens">—</strong></article>
    <article><span>估算费用 <small>USD</small></span><strong id="cost">—</strong></article>
  </section>
  <section class="chart-panel">
    <div class="chart-toolbar"><div class="chart-tabs" role="tablist" aria-label="统计指标"><button id="tab-tokens" role="tab" aria-selected="true" aria-controls="token-panel" tabindex="0">Token</button><button id="tab-cost" role="tab" aria-selected="false" aria-controls="cost-panel" tabindex="-1">费用</button><button id="tab-quota" role="tab" aria-selected="false" aria-controls="quota-panel" tabindex="-1">额度</button></div><label class="layout-field"><span class="sr-only">柱状图布局</span><select id="layout"><option value="stacked">堆叠</option><option value="grouped">分组</option></select></label></div>
    <div id="usage-caption" class="chart-caption"><span id="chart-period">今天</span><span><b id="models">—</b> 个模型</span></div>
    <div id="token-panel" role="tabpanel" aria-labelledby="tab-tokens"><div id="token-chart" class="chart"></div></div>
    <div id="cost-panel" role="tabpanel" aria-labelledby="tab-cost" hidden><div id="cost-chart" class="chart"></div></div>
    <div id="quota-panel" role="tabpanel" aria-labelledby="tab-quota" hidden>
      <div class="quota-editor"><label class="quota-field"><span>周额度类别</span><select id="quota-bucket"><option value="codex">Codex</option></select></label></div>
      <p id="quota-state" class="quota-help">打开或刷新时自动采集，同一分钟保留最新值。</p>
      <div class="quota-caption"><span id="quota-period">按天记录</span><span>最新 <b id="quota-latest">—</b></span></div>
      <div id="quota-chart" class="chart"></div>
    </div>
    <div id="legend" aria-label="模型图例"></div>
  </section>
  <details id="model-details" class="model-details"><summary>模型明细<span>查看完整数据</span></summary><div class="table-wrap"><table><thead><tr><th>日期</th><th>模型</th><th>非缓存输入</th><th>缓存读取</th><th>缓存写入</th><th>输出</th><th>总 Token</th><th>估算 USD</th></tr></thead><tbody id="details"></tbody></table></div></details>
  <footer><div class="sync-line"><span id="status" role="status">正在读取统计…</span><span id="meta"></span></div><p>本机日志 · 北京时间 · API 等价估算，非实际扣费</p></footer>
</main>
<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
<script src="dashboard.js" type="module"></script>
</body></html>
